name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ACTIONS_NODE20_DEPRECATION_WARNING: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Astro Build & Image Assets
        uses: actions/cache@v4
        with:
          path: |
            .astro
            node_modules/.cache
          key: astro-image-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json', 'src/assets/images/**') }}
          restore-keys: |
            astro-image-cache-${{ runner.os }}-

      - name: Install & Build Site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
