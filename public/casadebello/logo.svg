<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-labelledby="title">
  <title id="title">Whispering Pines Resort by Casa De Bello — Ramgarh</title>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0BE"/>
      <stop offset=".35" stop-color="#E5C36B"/>
      <stop offset=".65" stop-color="#B78B28"/>
      <stop offset="1" stop-color="#F8E3A3"/>
    </linearGradient>

    <path id="petal"
          d="M0,0 C-61,-32 -62,-90 0,-137
                   C62,-90 61,-32 0,0Z"/>
    <path id="innerPetal"
          d="M0,0 C-30,-20 -30,-52 0,-77
                   C30,-52 30,-20 0,0Z"/>
  </defs>

  <!-- Transparent background; intended for dark backgrounds -->

  <g transform="translate(140 150) scale(.82)"
     fill="none" stroke="url(#gold)"
     stroke-width="8" stroke-linejoin="round">
    <use href="#petal"/>
    <use href="#petal" transform="rotate(90)"/>
    <use href="#petal" transform="rotate(180)"/>
    <use href="#petal" transform="rotate(270)"/>

    <g stroke-width="6">
      <use href="#innerPetal"/>
      <use href="#innerPetal" transform="rotate(90)"/>
      <use href="#innerPetal" transform="rotate(180)"/>
      <use href="#innerPetal" transform="rotate(270)"/>
    </g>
  </g>

  <path d="M285,45 V255"
        stroke="url(#gold)" stroke-width="2"/>

  <g text-anchor="middle"
     font-family="Georgia, 'Times New Roman', serif">

    <text x="745" y="68"
          fill="#FFF9E9"
          font-size="25"
          letter-spacing="4">
      WHISPERING PINES RESORT
    </text>

    <text x="745" y="106"
          fill="#E8CB80"
          font-size="23"
          font-style="italic">
      by
    </text>

    <!-- Dominant brand -->
    <text x="745" y="184"
          fill="url(#gold)"
          font-size="78"
          font-weight="bold"
          letter-spacing="3">
      CASA DE BELLO
    </text>

    <path d="M510,214 H980"
          fill="none"
          stroke="url(#gold)"
          stroke-width="1.5"/>

    <text x="749" y="252"
          fill="#FFF9E9"
          font-size="18"
          letter-spacing="8">
      RAMGARH
    </text>
  </g>
</svg>
